# Deletes a pull request's prose-review artifacts when the PR merges.
#
# Why (issue #206, mitigating issue #197): the prose-review job publishes its work
# directory - three model-written files - as a world-downloadable build artifact,
# screened for credentials only. The reviewer reads inputs any GitHub user can write
# (prior review comments, the falsified-findings ledger), so an injection there can
# place attacker-chosen text into that artifact. The artifact's value is bounded by
# the review loop's lifetime; its risk is not - each artifact otherwise lives 30 days
# past the loop it served. Deleting on merge bounds the channel to exactly the window
# in which the artifact is useful.
#
# Merged PRs only, deliberately: a closed-but-unmerged PR keeps its artifacts for
# post-mortem. Twice on PR #195 a real defect existed ONLY as a refuted candidate in
# the artifact - an abandoned PR is exactly the case where that record still matters,
# and an abandoned PR's loop has not "served its purpose". The 30-day expiry still
# bounds those.
#
# Runs are found by workflow + head branch + event, then filtered to runs that GitHub
# associates with THIS pull request. Fork PRs never produce artifacts (the review job
# gates them off before the model runs), so `pull_requests` is populated for every run
# this can match; the branch filter alone would over-delete when a branch name is
# reused across PRs.

name: Prose review artifact cleanup

on:
  pull_request:
    types: [closed]

permissions:
  # Deleting artifacts is the entire job; `actions: write` is the scope that allows it.
  # No checkout, so no contents scope.
  actions: write

jobs:
  delete-artifacts:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}

    steps:
      - name: Delete this PR's prose-review artifacts
        run: |
          set -euo pipefail
          repo='${{ github.repository }}'

          # All runs of the prose-review workflow for this PR's head branch. --paginate
          # because a long review loop produces many runs (PR #195 reached 23 artifacts).
          # HEAD_BRANCH is attacker-chosen on a fork PR; -f passes it as a URL-encoded
          # query parameter instead of splicing it into the URL, where a "&" in a branch
          # name could inject extra parameters.
          run_ids=""
          if ! run_ids=$(gh api -X GET "repos/$repo/actions/workflows/prose-review.yml/runs" \
            -f head_branch="$HEAD_BRANCH" -f event=pull_request \
            --paginate \
            --jq ".workflow_runs[] | select(.pull_requests[]?.number == ($PR_NUMBER | tonumber)) | .id"); then
            # A TRANSIENT gh api failure must not abort the whole cleanup: the worst
            # case of a partial/empty sweep is an artifact left to its 30-day expiry,
            # which is exactly the same fallback the post-mortem already relies on.
            # Aborting here would instead lose the merge-time deletion entirely.
            echo "::warning::could not list prose-review runs for PR #$PR_NUMBER; leaving artifacts to 30-day expiry"
            run_ids=""
          fi

          if [ -z "$run_ids" ]; then
            echo "No prose-review runs found for PR #$PR_NUMBER (branch $HEAD_BRANCH); nothing to delete."
            exit 0
          fi

          deleted=0
          for run_id in $run_ids; do
            # Artifact IDs first, names logged for the record. The name prefix is a
            # belt-and-suspenders guard: these runs only ever upload prose-review-*,
            # but a future second upload step should not be silently swept up here.
            # Count artifacts actually deleted (the inner while is a subshell, so
            # accumulate on the outer loop's own counter) -- "deleted" is artifacts,
            # not runs; a run can carry several.
            while read -r artifact_id artifact_name; do
              echo "Deleting $artifact_name (run $run_id)"
              gh api -X DELETE "repos/$repo/actions/artifacts/$artifact_id"
              deleted=$((deleted + 1))
            done < <(gh api "repos/$repo/actions/runs/$run_id/artifacts" --paginate \
              --jq '.artifacts[] | select(.name | startswith("prose-review-")) | "\(.id) \(.name)"')
          done
          echo "Swept $deleted artifact(s) across the prose-review runs for PR #$PR_NUMBER."
